services:
  clipforge:
    build: .
    depends_on:
      yt-pot-provider:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765"
    group_add:
      - "${CLIPFORGE_CONFIG_GROUP_GID:-1000}"
    environment:
      CLIPFORGE_DATA_DIR: /data
      CLIPFORGE_YOUTUBE_COOKIES_FILE: ${CLIPFORGE_YOUTUBE_COOKIES_FILE:-/run/clipforge-auth/youtube.txt}
      CLIPFORGE_DOWNLOAD_IP_FAMILY: ${CLIPFORGE_DOWNLOAD_IP_FAMILY:-ipv4}
      # Private Docker DNS name; never publish the token server to the host.
      CLIPFORGE_YOUTUBE_POT_URL: http://yt-pot-provider:4416
      CLIPFORGE_OLLAMA_URL: ${CLIPFORGE_OLLAMA_URL:-http://ollama:11434}
      CLIPFORGE_AI_MODEL: ${CLIPFORGE_AI_MODEL:-llama3.2:3b}
      CLIPFORGE_VISION_MODEL: ${CLIPFORGE_VISION_MODEL:-moondream}
      CLIPFORGE_AI_BATCH_SIZE: ${CLIPFORGE_AI_BATCH_SIZE:-4}
      CLIPFORGE_AI_TIMEOUT: ${CLIPFORGE_AI_TIMEOUT:-600}
      CLIPFORGE_AI_RETRIES: ${CLIPFORGE_AI_RETRIES:-3}
      CLIPFORGE_WHISPER_MODEL: ${CLIPFORGE_WHISPER_MODEL:-base}
      CLIPFORGE_FFMPEG_THREADS: ${CLIPFORGE_FFMPEG_THREADS:-2}
      CLIPFORGE_ADMIN_PASSWORD_HASH: ${CLIPFORGE_ADMIN_PASSWORD_HASH:-}
      CLIPFORGE_ELEVENLABS_API_KEY: ${CLIPFORGE_ELEVENLABS_API_KEY:-}
      CLIPFORGE_ELEVENLABS_VOICE_ID: ${CLIPFORGE_ELEVENLABS_VOICE_ID:-}
      CLIPFORGE_ELEVENLABS_MODEL: ${CLIPFORGE_ELEVENLABS_MODEL:-eleven_multilingual_v2}
      CLIPFORGE_YOUTUBE_CLIENT_ID: ${CLIPFORGE_YOUTUBE_CLIENT_ID:-}
      CLIPFORGE_YOUTUBE_CLIENT_SECRET: ${CLIPFORGE_YOUTUBE_CLIENT_SECRET:-}
      CLIPFORGE_YOUTUBE_REFRESH_TOKEN: ${CLIPFORGE_YOUTUBE_REFRESH_TOKEN:-}
      CLIPFORGE_INSTAGRAM_TOKEN: ${CLIPFORGE_INSTAGRAM_TOKEN:-}
      CLIPFORGE_INSTAGRAM_USER_ID: ${CLIPFORGE_INSTAGRAM_USER_ID:-}
      CLIPFORGE_FACEBOOK_PAGE_ACCESS_TOKEN: ${CLIPFORGE_FACEBOOK_PAGE_ACCESS_TOKEN:-}
      CLIPFORGE_TIKTOK_ACCESS_TOKEN: ${CLIPFORGE_TIKTOK_ACCESS_TOKEN:-}
      CLIPFORGE_META_API_VERSION: ${CLIPFORGE_META_API_VERSION:-v24.0}
    volumes:
      - clipforge_data:/data
      - ./private-auth:/run/clipforge-auth:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  yt-pot-provider:
    # Pin plugin and sidecar together. The old pre-2.0 releases had an RCE advisory.
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    # No ports: only containers on this Compose network may reach port 4416.
    expose:
      - "4416"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const response = await fetch('http://127.0.0.1:4416/ping'); if (!response.ok) Deno.exit(1);"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
  clipforge_data:
