name: Validate and release ClipForge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate Docker Compose (local and Tailscale)
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.tailscale.yaml config --quiet
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package with test tools
        run: python -m pip install -e '.[dev]'
      - name: Validate browser JavaScript
        run: |
          node --check clipforge/static/app.js
          node --check clipforge/static/analytics.js
      - name: Lint
        run: ruff check .
      - name: Unit and end-to-end media tests
        run: pytest -vv --maxfail=1 --timeout=90

  docker-smoke:
    name: Docker image and API smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image with FFmpeg and Whisper
        run: docker build -t clipforge:ci .
      - name: Verify PyAV compatible with released faster-whisper
        run: |
          docker run --rm --entrypoint python clipforge:ci -c 'import av; print("PyAV", av.__version__); assert int(av.__version__.split(".")[0]) < 19'
      - name: Verify yt-dlp YouTube JS challenge support
        run: |
          docker run --rm --entrypoint deno clipforge:ci --version
          docker run --rm --entrypoint python clipforge:ci -c 'import importlib.metadata as m; import shutil; assert shutil.which("deno"); print("yt-dlp:", m.version("yt-dlp")); print("yt-dlp-ejs:", m.version("yt-dlp-ejs"))'
      - name: Launch container
        run: docker run -d --name clipforge-smoke -p 127.0.0.1:8765:8765 clipforge:ci
      - name: Check running API
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then exit 0; fi
            sleep 2
          done
          docker logs clipforge-smoke
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f clipforge-smoke || true

  package:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: clipforge-distributions
          path: dist/*
          if-no-files-found: error

  prerelease:
    name: Publish tested prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, package, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clipforge-distributions
          path: dist
      - name: Create prerelease on tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.8.0-preview.${RUN_NUMBER}"
          gh release create "$tag" dist/* \
            --target "$SOURCE_SHA" \
            --title "ClipForge $tag" \
            --prerelease \
            --generate-notes
