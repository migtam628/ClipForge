[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge-studio"
version = "0.2.0"
description = "Self-hosted URL-to-short-video clipping studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ClipForge Contributors"}]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
ai = ["faster-whisper>=1.1,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
clipforge = "clipforge.__main__:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
